<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>SkillMap</title>
  </head>
  <body>
    <header>
      <h1>SkillMap</h1>
      <p>Know what to learn. Prove what you can do.</p>
    </header>

    <main>
      <section>
        <h2>Choose your career</h2>

        <select id="career-select">
          <option value="frontend">Frontend Developer</option>
        </select>
      </section>

      <section>
        <h2>Your Skill Map</h2>
        <p id="progress-text">Progress: 0%</p>

        <div id="progress-bar">
          <div id="progress-fill"></div>
        </div>

        <ul id="skill-list">
          <li>HTML</li>
          <li>CSS</li>
          <li>JavaScript</li>
          <li>Git & GitHub</li>
          <li>REST APIs</li>
          <li>React</li>
          <li>TypeScript</li>
          <li>Next.js</li>
        </ul>
      </section>

      <section>
        <h2>Your Next Skill</h2>

        <h3 id="next-skill">JavaScript</h3>

        <p>Learn - Practice - Prove</p>
        <button id="startlearning">Start Learning</button>
      </section>
    </main>

    <script src="./js/app.js"></script>
  </body>
</html>
